name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init pro submodule (optional)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -n "${PRIVATE_REPO_TOKEN}" ]; then
            git config --global url."https://${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          else
            echo "No PRIVATE_REPO_TOKEN; skipping submodules"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm test --if-present

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VSCODE_MARKETPLACE_TOKEN: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Init pro submodule (optional)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -n "${PRIVATE_REPO_TOKEN}" ]; then
            git config --global url."https://${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          else
            echo "No PRIVATE_REPO_TOKEN; skipping submodules"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm --prefix ./extension install
      - run: npm --prefix ./extension run compile
      - run: npx @vscode/vsce@2.26.0 publish -p "${VSCODE_MARKETPLACE_TOKEN}"
        if: env.VSCODE_MARKETPLACE_TOKEN != ''
        working-directory: ./extension
      - run: 'echo "Skipping VS Code Marketplace publish: VSCODE_MARKETPLACE_TOKEN not set."'
        if: env.VSCODE_MARKETPLACE_TOKEN == ''
