name: Release Artifacts (VSIX + Binaries)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps (skip scripts)
        run: npm install --ignore-scripts

      - name: Prepare dist/
        run: node -e "require('fs').mkdirSync('dist', { recursive: true })"

      - name: Build binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npx pkg . --targets node18-win-x64 --output dist/synapse-win-x64.exe
          npx pkg . --targets node18-win-arm64 --output dist/synapse-win-arm64.exe
          Compress-Archive -Path dist/synapse-win-x64.exe -DestinationPath dist/synapse-win-x64.zip -Force
          Compress-Archive -Path dist/synapse-win-arm64.exe -DestinationPath dist/synapse-win-arm64.zip -Force
          Remove-Item dist/synapse-win-x64.exe, dist/synapse-win-arm64.exe -Force

      - name: Build binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          npx pkg . --targets node18-macos-x64 --output dist/synapse-macos-x64
          npx pkg . --targets node18-macos-arm64 --output dist/synapse-macos-arm64
          chmod +x dist/synapse-macos-x64 dist/synapse-macos-arm64
          tar -C dist -czf dist/synapse-macos-x64.tar.gz synapse-macos-x64
          tar -C dist -czf dist/synapse-macos-arm64.tar.gz synapse-macos-arm64
          rm -f dist/synapse-macos-x64 dist/synapse-macos-arm64

      - name: Build binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npx pkg . --targets node18-linux-x64 --output dist/synapse-linux-x64
          npx pkg . --targets node18-linux-arm64 --output dist/synapse-linux-arm64
          chmod +x dist/synapse-linux-x64 dist/synapse-linux-arm64
          tar -C dist -czf dist/synapse-linux-x64.tar.gz synapse-linux-x64
          tar -C dist -czf dist/synapse-linux-arm64.tar.gz synapse-linux-arm64
          rm -f dist/synapse-linux-x64 dist/synapse-linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ runner.os }}
          path: dist/

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install extension deps (skip scripts)
        run: npm --prefix extension install --ignore-scripts
      - run: npm --prefix extension run compile

      - name: Build VSIX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npx --prefix extension @vscode/vsce@2.26.0 package --out ../dist/synapse.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: synapse-vsix
          path: dist/synapse.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, vsix]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -maxdepth 4 -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*
