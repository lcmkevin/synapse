name: Release Artifacts (VSIX + Binaries)

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/upload (e.g. v0.1.3-r1)"
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps (skip scripts)
        run: npm install --ignore-scripts

      - name: Prepare dist/
        run: node -e "require('fs').mkdirSync('dist',{recursive:true})"

      - name: Build binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $built = $false

          try {
            npx pkg . --targets node18-win-x64 --output dist/synapse-win-x64.exe
            Compress-Archive -Path dist/synapse-win-x64.exe -DestinationPath dist/synapse-win-x64.zip -Force
            Remove-Item dist/synapse-win-x64.exe -Force
            $built = $true
          } catch {
            Write-Host "Windows x64 build failed: $($_.Exception.Message)"
          }

          try {
            npx pkg . --targets node18-win-arm64 --output dist/synapse-win-arm64.exe
            Compress-Archive -Path dist/synapse-win-arm64.exe -DestinationPath dist/synapse-win-arm64.zip -Force
            Remove-Item dist/synapse-win-arm64.exe -Force
            $built = $true
          } catch {
            Write-Host "Windows arm64 build failed: $($_.Exception.Message)"
          }

          if (-not $built) { throw "No Windows binaries were produced." }

      - name: Build binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          built=0
          if npx pkg . --targets node18-macos-x64 --output dist/synapse-macos-x64; then
            chmod +x dist/synapse-macos-x64
            tar -C dist -czf dist/synapse-macos-x64.tar.gz synapse-macos-x64
            rm -f dist/synapse-macos-x64
            built=$((built+1))
          else
            echo "macOS x64 build failed"
          fi
          if npx pkg . --targets node18-macos-arm64 --output dist/synapse-macos-arm64; then
            chmod +x dist/synapse-macos-arm64
            tar -C dist -czf dist/synapse-macos-arm64.tar.gz synapse-macos-arm64
            rm -f dist/synapse-macos-arm64
            built=$((built+1))
          else
            echo "macOS arm64 build failed"
          fi
          if [ "$built" -eq 0 ]; then
            echo "No macOS binaries were produced."
            exit 1
          fi

      - name: Build binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          built=0
          if npx pkg . --targets node18-linux-x64 --output dist/synapse-linux-x64; then
            chmod +x dist/synapse-linux-x64
            tar -C dist -czf dist/synapse-linux-x64.tar.gz synapse-linux-x64
            rm -f dist/synapse-linux-x64
            built=$((built+1))
          else
            echo "Linux x64 build failed"
          fi
          if npx pkg . --targets node18-linux-arm64 --output dist/synapse-linux-arm64; then
            chmod +x dist/synapse-linux-arm64
            tar -C dist -czf dist/synapse-linux-arm64.tar.gz synapse-linux-arm64
            rm -f dist/synapse-linux-arm64
            built=$((built+1))
          else
            echo "Linux arm64 build failed"
          fi
          if [ "$built" -eq 0 ]; then
            echo "No Linux binaries were produced."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ runner.os }}
          path: dist/

  vsix:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install extension deps (skip scripts)
        run: npm --prefix extension install --ignore-scripts
      - run: npm --prefix extension run compile

      - name: Build VSIX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -rf extension/node_modules/synapse-cli || true
          cd extension
          npx @vscode/vsce@2.26.0 package --out ../dist/synapse.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: synapse-vsix
          path: dist/synapse.vsix

  release:
    if: startsWith(needs.setup.outputs.tag, 'v')
    runs-on: ubuntu-latest
    needs: [setup, build, vsix]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -maxdepth 4 -print

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: |
            release-assets/**/*
