name: Supabase Keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secret: SUPABASE_ANON_KEY"
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          COMMON_HEADERS=(-H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          ping() {
            local label="$1"
            local url="$2"
            local body_file="/tmp/supabase_keepalive_body.txt"

            rm -f "${body_file}"
            local http_code=""
            local curl_exit=0
            http_code="$(curl -sS --connect-timeout 10 --max-time 20 --retry 3 --retry-all-errors "${COMMON_HEADERS[@]}" -o "${body_file}" -w "%{http_code}" "${url}" || curl_exit=$?)"

            if [ "${curl_exit}" -ne 0 ]; then
              echo "ERROR: ${label} request failed (curl exit=${curl_exit})"
              echo "URL: ${url}"
              if [ -f "${body_file}" ]; then
                echo "Body (first 400 chars):"
                head -c 400 "${body_file}" || true
                echo ""
              fi
              return 1
            fi

            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              echo "ERROR: ${label} returned HTTP ${http_code}"
              echo "URL: ${url}"
              if [ -f "${body_file}" ]; then
                echo "Body (first 400 chars):"
                head -c 400 "${body_file}" || true
                echo ""
              fi
              return 1
            fi

            echo "OK: ${label} (HTTP ${http_code})"
            return 0
          }

          ok=0

          if ping "Auth health" "${BASE}/auth/v1/health"; then ok=$((ok+1)); fi
          if ping "REST root" "${BASE}/rest/v1/"; then ok=$((ok+1)); fi

          if [ "${ok}" -ge 1 ]; then
            echo "Keepalive OK (${ok} endpoint(s) succeeded)"
            exit 0
          fi

          echo "Keepalive FAILED (no endpoints succeeded)"
          exit 1
