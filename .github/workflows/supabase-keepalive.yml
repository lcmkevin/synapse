name: Supabase Keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secret: SUPABASE_ANON_KEY"
            exit 1
          fi

          BASE="${SUPABASE_URL%/}"
          COMMON_HEADERS=(-H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Pinging auth health..."
          curl -fsS --retry 3 --retry-all-errors --max-time 20 "${COMMON_HEADERS[@]}" "${BASE}/auth/v1/health" > /dev/null

          echo "Pinging realtime health..."
          curl -fsS --retry 3 --retry-all-errors --max-time 20 "${COMMON_HEADERS[@]}" "${BASE}/realtime/v1/health" > /dev/null

          echo "Pinging storage health..."
          curl -fsS --retry 3 --retry-all-errors --max-time 20 "${COMMON_HEADERS[@]}" "${BASE}/storage/v1/health" > /dev/null

          echo "OK"
